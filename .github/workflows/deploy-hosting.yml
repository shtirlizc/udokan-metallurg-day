name: Deploy to мы-удокан.рф

# Push to `production` (or run manually) → build for the site root → upload over SFTP.
# Repository secrets: SFTP_USER, SFTP_PASSWORD.
# Repository variable (optional): SFTP_PATH — the site folder on the server.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build for мы-удокан.рф
        run: |
          npm ci
          npx astro build
        env:
          SITE_URL: https://xn----8sblyhke2b8d.xn--p1ai
          SITE_BASE: /

      - name: Upload over SFTP
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ vars.SFTP_PATH || 'xn----8sblyhke2b8d.xn--p1ai' }}
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$SFTP_PASSWORD" ]; then
            echo "::error::Add SFTP_USER and SFTP_PASSWORD in Settings → Secrets and variables → Actions"
            exit 1
          fi
          sudo apt-get install -y -qq lftp
          # Uploads new and changed files only; nothing is deleted on the server.
          lftp -u "$SFTP_USER,$SFTP_PASSWORD" sftp://legko.sparse.ru:22 -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --only-newer --parallel=4 --verbose dist/ $SFTP_PATH;
            bye"
